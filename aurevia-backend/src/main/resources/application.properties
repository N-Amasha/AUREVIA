# =========================================================
# AUREVIA Backend
# =========================================================

spring.application.name=aurevia-backend
server.port=8080

# =========================================================
# MariaDB Connection
# XAMPP MariaDB: localhost:3306
# =========================================================

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/aurevia_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Stop quickly if the database cannot be reached
spring.datasource.hikari.connection-timeout=20000

# =========================================================
# JPA / Hibernate
# =========================================================

# Validate mappings against the existing schema.
# Never use create or create-drop with the completed database.
spring.jpa.hibernate.ddl-auto=validate

# Keep persistence logic inside the service layer
spring.jpa.open-in-view=false

# SQL output can be enabled later while developing repositories
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =========================================================
# Actuator
# =========================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

info.app.name=AUREVIA Backend
info.app.description=REST API for the AUREVIA Restaurant and Event Management System
info.app.version=0.0.1-SNAPSHOT